# Pages CMS configuration: https://pagescms.org/docs/
# Sign in at https://app.pagescms.org with GitHub and open the Portfolio repository.

media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [image]
  - name: files
    label: Files
    input: public/files
    output: /files
    categories: [document]

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, category, proudest, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: Shown above the project image and at the top of its page.
      - name: category
        label: Category
        type: string
        description: A word or two, e.g. Hardware, Design, Research, Machine learning.
      - name: proudest
        label: Proudest project
        type: boolean
        description: Turn on to show this project in "Proudest projects" at the bottom of the home page.
      - name: order
        label: Order
        type: number
        description: Lower numbers show first within their section (1, 2, 3...).
      - name: image
        label: Main image
        type: image
        description: The thumbnail on the home page and the large image at the top of the project page. Wide images (about 1600px) look best.
        options:
          media: images
          path: public/images/projects
          rename: safe
      - name: imageAlt
        label: Image description
        type: string
        description: A short description of the main image for screen readers.
      - name: summary
        label: Summary
        type: text
        description: One or two sentences shown under the title on the project page.
      - name: role
        label: My role
        type: string
      - name: team
        label: Team
        type: string
      - name: timeline
        label: Timeline
        type: string
        description: e.g. Fall 2026, or Jan–May 2026
      - name: tools
        label: Tools
        type: string
        description: e.g. SolidWorks, MATLAB, Arduino
      - name: body
        label: Project writeup
        type: rich-text
        description: The main story. Use headings for sections and insert images anywhere.
        options:
          format: markdown
          media: images
          path: public/images/projects
          rename: safe

  - name: site
    label: Home page & settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Your name
        type: string
        description: Shown in the top-left corner, the browser tab and the footer.
      - name: intro_heading
        label: Intro heading
        type: string
      - name: intro_text
        label: Intro text
        type: text
      - name: pointer_text
        label: Line pointing to proudest projects
        type: string
      - name: pointer_link
        label: Link text to jump to proudest projects
        type: string
      - name: photo
        label: Your photo
        type: image
        description: A portrait-shaped photo (taller than wide) works best.
        options:
          media: images
          path: public/images
          rename: safe
      - name: photo_caption
        label: Photo caption
        type: string
      - name: projects_heading
        label: Projects heading
        type: string
      - name: projects_description
        label: Projects description
        type: text
      - name: proudest_heading
        label: Proudest projects heading
        type: string
      - name: proudest_description
        label: Proudest projects description
        type: text
      - name: contact_heading
        label: Contact heading
        type: string
      - name: contact_text
        label: Contact text
        type: text
      - name: email
        label: Email
        type: string
        description: Leave empty to hide it.
      - name: linkedin
        label: LinkedIn URL
        type: string
        description: Full address, e.g. https://www.linkedin.com/in/your-name. Leave empty to hide it.
      - name: resume
        label: Resume (PDF)
        type: file
        description: Leave empty to hide the resume links.
        options:
          media: files
          path: public/files
          extensions: [pdf]
          rename: safe
      - name: seo_description
        label: Search engine description
        type: text
        description: The short summary Google shows under your site's name.
      - name: color_gold
        label: Accent color (gold)
        type: string
        description: Hex color code, e.g. #d9b45b. Invalid codes are ignored.
        pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
      - name: color_purple
        label: Highlight color (purple)
        type: string
        description: Hex color code, e.g. #8a63d2.
        pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
      - name: color_background
        label: Background color
        type: string
        description: Hex color code, e.g. #08070b. Keep it dark so text stays readable.
        pattern: ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
